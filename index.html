<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapon Tili Viktorina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-white font-sans min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center py-4 border-b border-gray-800">
        <div class="flex items-center gap-3">
            <div class="bg-[#e11d48] text-white px-3 py-1.5 rounded-lg text-sm font-bold tracking-wider">
                日本語
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide">Yapon Tili Viktorina</h1>
                <p class="text-xs text-gray-400">N5 Kanji & Lug'at mashq dasturi</p>
            </div>
        </div>
        <div class="bg-[#1e293b] border border-gray-700 px-3 py-1.5 rounded-lg flex items-center gap-2 text-sm text-amber-400 font-semibold">
            <i class="fa-solid fa-[#f59e0b] fa-fire"></i>
            <span id="streak">0</span> <span class="text-gray-400 text-xs font-normal">Ketma-ket</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto w-full flex-1 flex flex-col items-center justify-center my-6 gap-6">
        
        <!-- Mode Switcher -->
        <div class="bg-[#1e293b] p-1.5 rounded-xl flex gap-2 border border-gray-700/50 w-fit">
            <button id="mode-test" onclick="switchMode('test')" class="px-6 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap"></i> Test Rejimi
            </button>
            <button id="mode-flashcard" onclick="switchMode('flashcard')" class="px-6 py-2 rounded-lg text-sm font-medium bg-[#e11d48] text-white shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-clone"></i> Flashcard
            </button>
        </div>

        <!-- Level & Category Selector -->
        <select id="level-select" onchange="changeCategory()" class="bg-[#1e293b] border border-gray-700 text-white text-sm rounded-lg px-4 py-2 focus:ring-2 focus:ring-rose-500 focus:outline-none cursor-pointer">
            <option value="n5_kanji">JLPT N5 — Kanji (Iyerogliflar)</option>
            <option value="n5_vocab">JLPT N5 — Lug'at (Kotoba)</option>
        </select>

        <!-- Flashcard Box -->
        <div class="bg-[#1e293b]/70 border border-gray-700/80 rounded-2xl p-10 w-full flex flex-col items-center justify-between min-h-[320px] shadow-2xl relative backdrop-blur-sm">
            <span id="card-category-label" class="text-xs font-semibold text-rose-400 tracking-widest uppercase">YAPONCHA KANJI</span>

            <div class="text-center my-auto flex flex-col items-center gap-3">
                <div id="kanji-display" class="text-6xl font-extrabold text-white my-2">男</div>
                <div id="reading-display" class="text-gray-300 text-lg tracking-wide">おとこ / ダン, ナン</div>
                <div id="meaning-display" class="text-base text-emerald-400 font-medium">Erkak, yigit</div>
            </div>

            <button onclick="speakWord()" class="flex items-center gap-2 text-gray-400 hover:text-white text-sm transition mt-4 hover:bg-gray-800/50 px-4 py-2 rounded-lg border border-gray-700/50">
                <i class="fa-solid fa-volume-high text-rose-500"></i> Eshitish
            </button>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-between w-full gap-4">
            <button onclick="prevCard()" class="bg-[#1e293b] hover:bg-gray-800 border border-gray-700 px-6 py-3 rounded-xl text-sm font-semibold flex items-center gap-2 transition w-1/3 justify-center">
                <i class="fa-solid fa-chevron-left"></i> Oldingisi
            </button>
            <div class="text-gray-400 text-sm font-medium tracking-wider">
                <span id="current-index" class="text-white">1</span> / <span id="total-cards">8</span>
            </div>
            <button onclick="nextCard()" class="bg-[#1e293b] hover:bg-gray-800 border border-gray-700 px-6 py-3 rounded-xl text-sm font-semibold flex items-center gap-2 transition w-1/3 justify-center">
                Keyingisi <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-500 py-4 border-t border-gray-800/50">
        Yapon tili o'rganish uchun interaktiv platforma • JLPT N5
    </footer>

    <!-- JavaScript Mantiqi -->
    <script>
        const database = {
            n5_kanji: [
                { word: '男', reading: 'おとこ / ダン, ナン', meaning: "Erkak, yigit, odam" },
                { word: '林', reading: 'はやし / リン', meaning: "Yog'och, kichik o'rmon" },
                { word: '森', reading: 'もり / シン', meaning: "O'rmon, changalzor" },
                { word: '休', reading: 'やす・む / キュウ', meaning: "Dam olish, bayram" },
                { word: '体', reading: 'からだ / タイ', meaning: "Tana, jismoniy holat" },
                { word: '住', reading: 'す・む / ジュウ', meaning: "Yashamoq, manzil, uy-joy" },
                { word: '明', reading: 'あか・るい / メイ, ミョウ', meaning: "Yorqin, yorug', aniq, ertaga" },
                { word: '字', reading: 'あざ / ジ', meaning: "Harf, belgi, iyeroglif" }
            ],
            n5_vocab: [
                { word: '結婚します', reading: 'けっこんします', meaning: "Uylanmoq, turmush qurmoq" },
                { word: '欲しい', reading: 'ほしい', meaning: "Xohlamoq" },
                { word: '経済', reading: 'けいざい', meaning: "Iqtisod" },
                { word: '電子レンジ', reading: 'でんしれんじ', meaning: "Mikroto'lqinli pech" },
                { word: '生け花', reading: 'いけばな', meaning: "Ikebana, gul aranjirovkasi" },
                { word: '天気', reading: 'てんき', meaning: "Ob-havo" },
                { word: 'お腹がすきました', reading: 'おなかがあきました', meaning: "Qornim ochdi" },
                { word: 'お腹がいっぱいです', reading: 'おなかがいっぱいです', meaning: "Qornim to'q" },
                { word: '何か', reading: 'なにか', meaning: "Nimadir" },
                { word: 'どこか', reading: 'どこか', meaning: "Qayerdadir" },
                { word: 'ゲームをします', reading: 'げーむをします', meaning: "O'yin o'ynamoq" },
                { word: '〜のとき', reading: '〜のとき', meaning: "〜ning payti" },
                { word: '疲れます', reading: 'つかれます', meaning: "Charchamoq" },
                { word: '疲れました', reading: 'つかれました', meaning: "Charchadim" },
                { word: '寂しい', reading: 'さびしい', meaning: "Sog'inish, yolg'izlanish" },
                { word: '広い', reading: 'ひろい', meaning: "Keng" },
                { word: '狭い', reading: 'せまい', meaning: "Tor" },
                { word: 'アルバイト', reading: 'あるばいと', meaning: "Soatbay ish (Part-time)" },
                { word: '歌舞伎', reading: 'かぶき', meaning: "Kabuki (Yapon teatri)" },
                { word: '晴れ', reading: 'はれ', meaning: "Ochiq-havo" },
                { word: '雨', reading: 'あめ', meaning: "Yomg'ir" },
                { word: '曇り', reading: 'くもり', meaning: "Bulutli" },
                { word: '雪', reading: 'ゆき', meaning: "Qor" },
                { word: 'お祭り', reading: 'おまつり', meaning: "Festival, marosim" },
                { word: 'でも', reading: 'でも', meaning: "Ammo, lekin" },
                { word: '初めて', reading: 'はじめて', meaning: "Birinchi marta" },
                { word: '特に', reading: 'とくに', meaning: "Ayniqsa" }
            ]
        };

        let currentCategory = 'n5_kanji';
        let currentIndex = 0;

        function updateCard() {
            const cardsData = database[currentCategory];
            const card = cardsData[currentIndex];
            
            document.getElementById('kanji-display').innerText = card.word;
            document.getElementById('reading-display').innerText = card.reading;
            document.getElementById('meaning-display').innerText = card.meaning;
            document.getElementById('current-index').innerText = currentIndex + 1;
            document.getElementById('total-cards').innerText = cardsData.length;
            
            document.getElementById('card-category-label').innerText = 
                currentCategory === 'n5_kanji' ? 'YAPONCHA KANJI (N5)' : 'YAPONCHA LUG\'AT (N5)';
        }

        function changeCategory() {
            currentCategory = document.getElementById('level-select').value;
            currentIndex = 0;
            updateCard();
        }

        function nextCard() {
            const cardsData = database[currentCategory];
            if (currentIndex < cardsData.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function speakWord() {
            const card = database[currentCategory][currentIndex];
            window.speechSynthesis.cancel(); // Avvalgi audioni to'xtatish

            const utterance = new SpeechSynthesisUtterance(card.word);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8;

            const voices = window.speechSynthesis.getVoices();
            const jaVoice = voices.find(v => v.lang.includes('ja') || v.lang.includes('JP'));
            if (jaVoice) {
                utterance.voice = jaVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function switchMode(mode) {
            const btnTest = document.getElementById('mode-test');
            const btnFlash = document.getElementById('mode-flashcard');
            
            if (mode === 'test') {
                btnTest.className = "px-6 py-2 rounded-lg text-sm font-medium bg-[#e11d48] text-white shadow-lg flex items-center gap-2";
                btnFlash.className = "px-6 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition flex items-center gap-2";
                alert("Test rejimi tez orada qo'shiladi!");
            } else {
                btnFlash.className = "px-6 py-2 rounded-lg text-sm font-medium bg-[#e11d48] text-white shadow-lg flex items-center gap-2";
                btnTest.className = "px-6 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition flex items-center gap-2";
            }
        }

        // Boshlang'ich yuklash
        window.speechSynthesis.onvoiceschanged = () => {};
        updateCard();
    </script>
</body>
</html>
