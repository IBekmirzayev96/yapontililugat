<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapon Tili va Kanji O'quv Portali</title>

  <!-- CSS USLUBLAR -->
  <style>
    /* Asosiy uslublar */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333333;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Dark mode (Tungi rejim) */
    body.dark-mode {
      background-color: #1e1e1e;
      color: #f1f1f1;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #2c3e50;
      color: white;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .theme-btn {
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      border-radius: 20px;
      background: #ecf0f1;
      color: #2c3e50;
      font-weight: bold;
      transition: 0.2s;
    }

    body.dark-mode .theme-btn {
      background: #34495e;
      color: #fff;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid #e0e0e0;
    }

    body.dark-mode .card {
      background: #2d2d2d;
      border-color: #444;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }

    body.dark-mode .input-field {
      background: #3c3c3c;
      color: #fff;
      border-color: #555;
    }

    .data-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .data-list li {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
    }

    body.dark-mode .data-list li {
      border-bottom-color: #444;
    }

    /* Test uslublari */
    .quiz-question {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 10px;
      border: 1px solid #16a085;
      background-color: #e8f8f5;
      color: #16a085;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-size: 15px;
      transition: 0.2s;
    }

    .option-btn:hover {
      background-color: #16a085;
      color: white;
    }

    .option-btn.correct {
      background-color: #2ecc71 !important;
      color: white !important;
      border-color: #27ae60;
    }

    .option-btn.wrong {
      background-color: #e74c3c !important;
      color: white !important;
      border-color: #c0392b;
    }

    .quiz-btn, .submit-btn {
      padding: 10px 20px;
      background: #2c3e50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 15px;
    }

    .quiz-result {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Yuqori panel va Tungi rejim -->
  <header class="header">
    <h1>Yapon Tili O'quv Portali</h1>
    <button id="theme-toggle" class="theme-btn">🌙 Tungi rejim</button>
  </header>

  <main class="container">

    <!-- 1. Qidiruv paneli -->
    <section class="card">
      <h2>🔍 Mavzular bo'yicha qidiruv</h2>
      <input type="text" id="search-input" placeholder="Mavzuni izlang (masalan: Kanji, Grammatika)..." class="input-field">
      <ul id="content-list" class="data-list">
        <li>Kanji darslari (体, 住, 明, 字)</li>
        <li>Minna no Nihongo lug'at to'plami</li>
        <li>Grammatika qoidalari va mashqlar</li>
        <li>Yapon tili N3/N4 imtihoniga tayyorgarlik</li>
      </ul>
    </section>

    <!-- 2. Kanji Test / Viktorina -->
    <section class="card">
      <h2>📝 Kanji Bilimini Sinash Testi</h2>
      <div id="quiz-box">
        <div id="question" class="quiz-question">Savol yuklanmoqda...</div>
        <div id="options" class="quiz-options"></div>
        <div id="result-message" class="quiz-result"></div>
        <button id="next-btn" class="quiz-btn" style="display: none;">Keyingi savol ➔</button>
      </div>
    </section>

    <!-- 3. Aks-aloqa formasi -->
    <section class="card">
      <h2>📬 Biz bilan bog'lanish</h2>
      <form id="contact-form" class="contact-form">
        <input type="text" placeholder="Ismingiz" class="input-field" required>
        <input type="email" placeholder="Email manzilingiz" class="input-field" required>
        <textarea placeholder="Xabaringizni yozing..." rows="4" class="input-field" required></textarea>
        <button type="submit" class="submit-btn">Yuborish</button>
      </form>
    </section>

  </main>

  <!-- JAVASCRIPT KODLARI -->
  <script>
    // 1. Dark/Light Mode (Tungi/Kungi rejim)
    const themeToggleBtn = document.getElementById('theme-toggle');

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      if (document.body.classList.contains('dark-mode')) {
        themeToggleBtn.textContent = '☀️ Kungi rejim';
      } else {
        themeToggleBtn.textContent = '🌙 Tungi rejim';
      }
    });

    // 2. Qidiruv paneli
    const searchInput = document.getElementById('search-input');
    const items = document.querySelectorAll('#content-list li');

    searchInput.addEventListener('input', (e) => {
      const filterText = e.target.value.toLowerCase();
      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(filterText) ? '' : 'none';
      });
    });

    // 3. Kanji Testi
    const quizData = [
      {
        question: "「体」 kanjisining ma'nosi nima?",
        options: ["yashamoq", "tana, badan", "yorqin", "harf"],
        correct: 1
      },
      {
        question: "「明日」 (あした) so'zi nimani anglatadi?",
        options: ["bugun", "kecha", "ertaga", "indin"],
        correct: 2
      },
      {
        question: "「住む」 (すむ) fe'lining ma'nosi nima?",
        options: ["yashamoq", "o'qimoq", "yozmoq", "ishlamoq"],
        correct: 0
      },
      {
        question: "「漢字」 so'zining o'qilishi qanday?",
        options: ["Kanji", "Hiragana", "Katakana", "Romaji"],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const resultEl = document.getElementById("result-message");

    function loadQuiz() {
      resetState();
      const currentQuiz = quizData[currentQuestion];
      questionEl.textContent = `${currentQuestion + 1}. ${currentQuiz.question}`;

      currentQuiz.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.textContent = option;
        button.classList.add("option-btn");
        button.addEventListener("click", () => selectOption(button, index, currentQuiz.correct));
        optionsEl.appendChild(button);
      });
    }

    function resetState() {
      nextBtn.style.display = "none";
      resultEl.textContent = "";
      optionsEl.innerHTML = "";
    }

    function selectOption(button, selected, correct) {
      const allButtons = optionsEl.querySelectorAll(".option-btn");
      allButtons.forEach(btn => btn.disabled = true);

      if (selected === correct) {
        button.classList.add("correct");
        resultEl.textContent = "To'g'ri javob! ✨";
        resultEl.style.color = "#2ecc71";
        score++;
      } else {
        button.classList.add("wrong");
        allButtons[correct].classList.add("correct");
        resultEl.textContent = "Noto'g'ri javob! ❌";
        resultEl.style.color = "#e74c3c";
      }

      nextBtn.style.display = "block";
    }

    nextBtn.addEventListener("click", () => {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuiz();
      } else {
        showFinalResult();
      }
    });

    function showFinalResult() {
      resetState();
      questionEl.textContent = "Test yakunlandi! 🎉";
      resultEl.textContent = `Siz ${quizData.length} ta savoldan ${score} tasiga to'g'ri javob berdingiz.`;
      resultEl.style.color = "#2c3e50";
    }

    loadQuiz();

    // 4. Contact Form
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert("Xabaringiz muvaffaqiyatli yuborildi!");
      e.target.reset();
    });
  </script>
</body>
</html>
